<section class="hero hero--default">
  <div class="hero__bg" aria-hidden="true">
    <img src="../../assets/images/hero-city-1.png" alt="" loading="eager">
  </div>

  <div class="hero__content">
    <h1 class="hero__title">Зажигай свет и&nbsp;дари тепло вместе с&nbsp;нами</h1>

    <form class="hero__search" action="/vacancies/" method="get" role="search">
      <svg class="hero__search-icon" width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <circle cx="17" cy="17" r="11" stroke="currentColor" stroke-width="2.4"/>
        <path d="M26 26l8 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <input class="hero__search-input" type="search" name="q" placeholder="Введите название вакансии" aria-label="Поиск вакансий">
      <button class="hero__search-submit" type="submit" aria-label="Найти">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 8h11M9 3l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a class="hero__search-all" href="#vacancies">Все вакансии</a>
    </form>
  </div>

  <div class="hero__tags">
    <div class="hero__tag hero__tag--violet">Стабильная компания</div>
    <div class="hero__tag hero__tag--sand">Масштаб задач</div>
    <div class="hero__tag hero__tag--green">Работа со смыслом</div>
    <div class="hero__tag hero__tag--rose">Сильная команда</div>
  </div>

  <div class="hero__marquee" aria-hidden="true">
    <div class="hero__marquee-track">
      <span class="hero__marquee-text">Стабильная компания&nbsp;&nbsp;•&nbsp;&nbsp;Масштаб задач&nbsp;&nbsp;•&nbsp;&nbsp;Работа со&nbsp;смыслом&nbsp;&nbsp;•&nbsp;&nbsp;Сильная команда&nbsp;&nbsp;•&nbsp;&nbsp;</span>
      <span class="hero__marquee-text">Стабильная компания&nbsp;&nbsp;•&nbsp;&nbsp;Масштаб задач&nbsp;&nbsp;•&nbsp;&nbsp;Работа со&nbsp;смыслом&nbsp;&nbsp;•&nbsp;&nbsp;Сильная команда&nbsp;&nbsp;•&nbsp;&nbsp;</span>
    </div>
  </div>
</section>
