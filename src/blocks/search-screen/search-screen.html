<div class="search-screen" data-search-screen hidden>
  <div class="search-screen__bar">
    <div class="search-screen__field">
      <svg class="search-screen__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="7" stroke="currentColor" stroke-width="2"/>
        <path d="M16 16l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input class="search-screen__input" type="search" name="q" placeholder="Введите поисковой запрос" aria-label="Поисковый запрос" data-search-input>
    </div>
    <button class="search-screen__close" type="button" data-search-close aria-label="Закрыть поиск">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <form class="search-screen__form" action="/search/" method="get">
    <input type="hidden" name="q" value="" data-search-hidden>
  </form>
</div>
