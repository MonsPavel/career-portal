<div class="vi-bar" data-vi-panel hidden>
  <div class="vi-bar__inner">
    <div class="vi-group" role="group" aria-label="Размер шрифта">
      <span class="vi-group__label">Шрифт</span>
      <div class="vi-seg">
        <button class="vi-seg__btn vi-seg__btn--sm" type="button" data-vi-set="size:sm" aria-pressed="false">A</button>
        <button class="vi-seg__btn vi-seg__btn--md" type="button" data-vi-set="size:md" aria-pressed="true">A</button>
        <button class="vi-seg__btn vi-seg__btn--lg" type="button" data-vi-set="size:lg" aria-pressed="false">A</button>
      </div>
    </div>

    <div class="vi-group" role="group" aria-label="Цвета сайта">
      <span class="vi-group__label">Цвета</span>
      <div class="vi-seg">
        <button class="vi-seg__btn vi-seg__theme" type="button" data-vi-set="theme:baw" aria-pressed="true" title="Чёрным по белому">
          <span class="vi-swatch vi-swatch--baw">Аа</span>
        </button>
        <button class="vi-seg__btn vi-seg__theme" type="button" data-vi-set="theme:wb" aria-pressed="false" title="Белым по чёрному">
          <span class="vi-swatch vi-swatch--wb">Аа</span>
        </button>
        <button class="vi-seg__btn vi-seg__theme" type="button" data-vi-set="theme:bb" aria-pressed="false" title="Синим по голубому">
          <span class="vi-swatch vi-swatch--bb">Аа</span>
        </button>
        <button class="vi-seg__btn vi-seg__theme" type="button" data-vi-set="theme:beige" aria-pressed="false" title="Бежевым по коричневому">
          <span class="vi-swatch vi-swatch--beige">Аа</span>
        </button>
        <button class="vi-seg__btn vi-seg__theme" type="button" data-vi-set="theme:green" aria-pressed="false" title="Зелёным на тёмно-коричневом">
          <span class="vi-swatch vi-swatch--green">Аа</span>
        </button>
      </div>
    </div>

    <div class="vi-group" role="group" aria-label="Изображения">
      <span class="vi-group__label">Изображения</span>
      <div class="vi-seg">
        <button class="vi-seg__btn" type="button" data-vi-set="img:on" aria-pressed="true">обычные</button>
        <button class="vi-seg__btn" type="button" data-vi-set="img:gray" aria-pressed="false">чёрно-белые</button>
        <button class="vi-seg__btn" type="button" data-vi-set="img:off" aria-pressed="false">выкл</button>
      </div>
    </div>

    <div class="vi-group" role="group" aria-label="Межбуквенный интервал">
      <span class="vi-group__label">Интервал</span>
      <div class="vi-seg">
        <button class="vi-seg__btn" type="button" data-vi-set="kern:normal" aria-pressed="true">обычный</button>
        <button class="vi-seg__btn" type="button" data-vi-set="kern:wide" aria-pressed="false">широкий</button>
      </div>
    </div>

    <button class="vi-exit" type="button" data-vi-toggle>Обычная версия сайта</button>
  </div>
</div>
