<section class="section" style="padding-top: 0;">
  <div class="container">
    <div class="page-head">
      <h1 class="page-title">Карьерные треки</h1>
      <p class="page-subtitle">Просмотрите карьерные траектории в компаниях Группы «Интер РАО»: от первой ступени до руководителя направления.</p>
    </div>

    <!-- TRACK_BANNER -->
  </div>
</section>

<section class="section" id="tracks">
  <div class="container" data-tracks>
    <div class="track-tabs">
      <!-- TRACK_TAB_BUTTONS -->
    </div>

    <script>
      window.__TRACKS_DATA__ = <!-- TRACKS_DATA -->;
    </script>

    <div class="track-chips" data-track-list></div>

    <h2 class="section__title" style="font-size: var(--fs-h3); line-height: 1.3; margin-bottom: 40px;" data-track-name></h2>

    <div class="steps-bar" data-steps></div>

    <div class="step-info" data-step-info></div>
  </div>
</section>

<section class="section">
  <div class="container">
    <h2 class="section__title section-title--h3">Тест на профориентацию</h2>
    <div class="test-quiz" data-career-test>
      <p class="test-progress" data-test-progress></p>
      <p class="test-question" data-test-question style="margin: 0;"></p>
      <div class="test-options" data-test-options></div>
      <div class="test-result" data-test-result hidden>
        <div class="test-result__title" style="font-size: var(--fs-h4); font-weight: var(--fw-h4); color: var(--color-primary);"></div>
        <div class="test-result__directions" data-test-directions></div>
        <p class="test-result__text" data-test-text style="margin: 0; font-size: var(--fs-small-regular); color: var(--color-text);"></p>
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <h2 class="section__title section-title--h3">Может быть интересно</h2>
    <div class="cards-grid cards-grid--4">
      <!-- TRACK_ARTICLES -->
    </div>
  </div>
</section>
