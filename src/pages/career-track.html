    </div>

    <!-- STUDENT_SUBNAV -->

<section class="section" id="tracks">
  <div class="container" data-tracks>
    <div class="track-tabs">
      <!-- TRACK_TAB_BUTTONS -->
    </div>

    <script>
      window.__TRACKS_DATA__ = <!-- TRACKS_DATA -->;
    </script>

    <div class="track-chips" data-track-list></div>

    <h2 class="section__title" style="font-size: var(--fs-h3); line-height: 1.3; margin-bottom: 40px;" data-track-name></h2>

    <div class="steps-bar" data-steps></div>

    <div class="step-info" data-step-info></div>
  </div>
</section>

<section class="section">
  <div class="container">
    <h2 class="section__title section-title--h3">Тест на профориентацию</h2>
    <div class="test" data-career-test>
      <div class="test__intro" data-test-intro>
        <img class="test__intro-photo" src="assets/images/students-photo-2.jpg" alt="">
        <div class="test__intro-body">
          <h3 class="test__intro-title" data-test-intro-title></h3>
          <p class="test__intro-text" data-test-intro-text style="margin: 0;"></p>
          <button class="btn btn--primary" type="button" data-test-start></button>
        </div>
      </div>

      <div class="test__quiz" data-test-quiz hidden>
        <p class="test-progress" data-test-progress style="margin: 0 0 16px;"></p>
        <img class="test__photo" data-test-image src="assets/images/media-4.jpg" alt="" style="margin-bottom: 20px;">
        <p class="test-question" data-test-question style="margin: 0 0 24px;"></p>
        <div class="test-options" data-test-options></div>
      </div>

      <div class="test__result" data-test-result hidden>
        <img class="test__result-photo" data-result-image src="assets/images/media-4.jpg" alt="">
        <h3 class="test__result-title" data-result-title style="margin: 24px 0 12px;"></h3>
        <div class="test-result__directions" data-test-directions></div>
        <p class="test__result-text" data-result-text style="margin: 16px 0 24px;"></p>
        <div class="test-result__links" data-result-links></div>
        <button class="btn btn--light" type="button" data-test-restart style="margin-top: 24px;">пройти тест ещё раз</button>
      </div>
    </div>
  </div>
</section>

</section>
